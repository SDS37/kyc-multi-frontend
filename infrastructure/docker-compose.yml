name: kyc-platform

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — primary relational database
  # PGDATA in Postgres 18+ is /var/lib/postgresql/18/docker. Mount the parent
  # directory so the named volume actually persists data.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: kyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kyc_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — cache / tokens (included for local DX; optional for the first slice)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: kyc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for KYC documents
  # ---------------------------------------------------------------------------
  minio:
    # Hub froze community images at this RELEASE tag (no more :latest updates).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: kyc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme1}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The API runs on the host for local MVP (`dotnet run` in apps/api).
  # Add an `api` Compose service (build context + Dockerfile) when containerizing it.

volumes:
  postgres_data:
  redis_data:
  minio_data:
