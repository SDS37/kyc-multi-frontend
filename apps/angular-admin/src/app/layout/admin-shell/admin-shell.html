<div class="shell">
  <header class="shell__header">
    <div class="shell__brand-block">
      <p class="shell__brand">KYC Admin</p>
      <nav class="shell__nav" aria-label="Primary">
        <a
          routerLink="/cases"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          Cases
        </a>
      </nav>
    </div>

    <div class="shell__session">
      @if (session(); as current) {
        <div class="shell__who" aria-live="polite">
          <span class="shell__tenant" [attr.title]="'Tenant id: ' + current.tenantId">
            {{ tenantLabel() }}
          </span>
          <span class="shell__sep" aria-hidden="true">·</span>
          <span class="shell__email">{{ current.email }}</span>
          <span class="shell__role">{{ roleLabel() }}</span>
        </div>
      }
      <button mat-stroked-button type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>

  <div class="shell__content">
    <router-outlet />
  </div>
</div>
