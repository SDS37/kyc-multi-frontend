<div class="shell">
  <a class="shell__skip" href="#main">{{ copy.skipToContent }}</a>
  <header class="shell__header">
    <div class="shell__brand-block">
      <p class="shell__brand">{{ copy.brand }}</p>
      <nav class="shell__nav" [attr.aria-label]="copy.primaryNavAria">
        <a
          routerLink="/cases"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          {{ copy.casesNav }}
        </a>
      </nav>
    </div>

    <div class="shell__session">
      @if (session(); as current) {
        <div class="shell__who" aria-live="polite">
          <span class="shell__tenant" [attr.title]="tenantTitle()">
            {{ tenantLabel() }}
          </span>
          <span class="shell__sep" aria-hidden="true">·</span>
          <span class="shell__email">{{ current.email }}</span>
          <span class="shell__role">{{ roleLabel() }}</span>
        </div>
      }
      <button mat-stroked-button type="button" (click)="signOut()">{{ copy.signOut }}</button>
    </div>
  </header>

  <main id="main" class="shell__content" tabindex="-1">
    <router-outlet />
  </main>
</div>
