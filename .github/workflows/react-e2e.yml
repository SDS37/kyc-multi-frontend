# Chromium smoke for React customer (KYC-110). Path-filtered so Angular/Vue PRs skip this job.
# Do not mark this workflow as a required check: skipped path filters leave no status.
name: react-e2e

on:
  pull_request:
    paths:
      - "apps/react-customer/**"
      - "apps/api/**"
      - "packages/design-tokens/**"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/react-e2e.yml"
      - ".github/workflows/e2e-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/react-customer/**"
      - "apps/api/**"
      - "packages/design-tokens/**"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/react-e2e.yml"
      - ".github/workflows/e2e-app.yml"

concurrency:
  group: react-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    uses: ./.github/workflows/e2e-app.yml
    with:
      app-directory: apps/react-customer
      node-version-file: apps/react-customer/.nvmrc
      cache-dependency-path: apps/react-customer/package-lock.json
      artifact-name: react-customer
