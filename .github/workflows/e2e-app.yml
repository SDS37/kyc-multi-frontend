# Reusable Playwright job: Postgres + Development API (seed) + one UI app.
# Called by angular-e2e / react-e2e / vue-e2e so an Angular-only PR does not pay for React/Vue.
name: e2e-app

on:
  workflow_call:
    inputs:
      app-directory:
        required: true
        type: string
      node-version-file:
        required: true
        type: string
      cache-dependency-path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5295
      ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=kyc_e2e;Username=kyc;Password=changeme
      Jwt__SigningKey: e2e-signing-key-at-least-32-chars!!!!
      Jwt__Issuer: kyc-api
      Jwt__Audience: kyc-clients
      Jwt__ExpiresMinutes: "60"
      ObjectStorage__Provider: InMemory
      ObjectStorage__BucketName: kyc-documents
      Seed__Enabled: "true"
      Registration__AllowPublicRegistration: "true"
      Captcha__Provider: none
      Captcha__RequiredForLogin: "false"
      Captcha__RequiredForRegister: "false"
      CI: "true"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: kyc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyc -d kyc_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Restore API
        run: |
          dotnet tool restore
          dotnet restore apps/api/Kyc.Api.sln

      - name: Migrate Postgres
        run: dotnet ef database update --project apps/api/Kyc.Api --startup-project apps/api/Kyc.Api

      - name: Build API
        run: dotnet build apps/api/Kyc.Api/Kyc.Api.csproj --no-restore --configuration Release

      - name: Start API
        run: |
          set -euo pipefail
          dotnet run --project apps/api/Kyc.Api/Kyc.Api.csproj --configuration Release --no-build --no-launch-profile > api-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5295/ready >/dev/null; then
              echo "API ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          tail -n 200 api-e2e.log
          exit 1

      - name: Install UI
        working-directory: ${{ inputs.app-directory }}
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ${{ inputs.app-directory }}
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: ${{ inputs.app-directory }}
        run: npm run test:e2e
